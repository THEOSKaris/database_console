[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "database_console"
version = "0.0.1"
description = "Execute SQL queries directly from Frappe/ERPNExt desk"
authors = [
	{ name = "Anthony Emmanuel", email = "mymi14s@hotmail.com" },
]
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = [
	"frappe",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["database_console*"]

[tool.bench.frappe-dependencies]
"frappe",
    "pypika @ git+https://github.com/frappe/pypika@2c50e6142b2d61d2d243e466fdd5dc03b3d918f2",
    "gunicorn @ git+https://github.com/frappe/gunicorn@bb554053bb87218120d76ab6676af7015680e8b6",

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
