[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "database_console"
version = "0.0.1"
description = "Execute SQL queries directly from Frappe/ERPNExt desk"
authors = [
	{ name = "Anthony Emmanuel", email = "mymi14s@hotmail.com" },
]
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
# frappe is installed via `bench init` -- do not declare it here. Doing so makes
# uv resolve frappe, whose own pypika and gunicorn deps are git+https URLs, and
# uv rejects URL dependencies that arrive transitively. With frappe absent, uv
# never resolves it, so those pins are not needed either.
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["database_console*"]

[tool.bench.frappe-dependencies]
frappe = ">=14.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
